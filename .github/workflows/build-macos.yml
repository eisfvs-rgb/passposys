name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:      # manual "Run workflow" button
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

env:
  MYSQL_VERSION: "8.0.46"   # bump this to track a newer MySQL release later
  MYSQL_TARBALL_URL: "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-8.0.46-macos15-arm64.tar.gz"

jobs:
  build-macos:
    runs-on: macos-14      # Apple Silicon (arm64) native runner
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create venv and install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright + Chromium (headless shell)
        run: |
          source venv/bin/activate
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m playwright install chromium

      # ------------------------------------------------------------------
      # Portable MySQL for macOS: MySQL DOES publish an official
      # "Compressed TAR Archive" for macOS (same idea as the Windows
      # portable zip) -- it's just not on the main web download page for
      # newer 9.x releases, only reachable via the direct /get/Downloads/
      # mirror path. That path is a stable, script-fetchable URL (no
      # browser/JS redirect), confirmed via MySQL's own install docs:
      # https://dev.mysql.com/doc/refman/8.4/en/macos-installation.html
      # ("Compressed TAR archive ... you do not need administrator
      # privileges using this method; you can install the MySQL server
      # anywhere using this method.")
      #
      # This gives byte-identical, official binaries -- no Homebrew
      # dependency, no guessing at lib/share layout.
      # ------------------------------------------------------------------
      - name: Fetch portable MySQL binaries (official tarball)
        run: |
          curl -L --fail -o mysql.tar.gz "$MYSQL_TARBALL_URL"

          mkdir -p portable_mysql
          tar -xzf mysql.tar.gz -C portable_mysql --strip-components=1
          rm mysql.tar.gz

          chmod +x portable_mysql/bin/*
          echo "Portable MySQL binary list:"
          ls -la portable_mysql/bin | grep -E "mysqld|mysqladmin|mysql$|mysqldump"

      - name: Write passposys.key from GitHub Secret
        env:
          PASSPOSYS_KEY: ${{ secrets.PASSPOSYS_KEY }}
        run: |
          if [ -z "$PASSPOSYS_KEY" ]; then
            echo "[ERROR] PASSPOSYS_KEY secret is not set."
            echo "Add it under repo Settings -> Secrets and variables -> Actions."
            echo "Value = the exact contents of your existing passposys.key file."
            exit 1
          fi
          printf '%s' "$PASSPOSYS_KEY" > passposys.key

      - name: Verify env.enc / token.enc / passposys.key are present
        run: |
          for f in env.enc token.enc passposys.key; do
            if [ ! -f "$f" ]; then
              echo "[ERROR] Required file '$f' not found in repo root."
              echo "These are the same encrypted files used on Windows --"
              echo "copy them into the repo (see README) before building."
              exit 1
            fi
          done

      - name: Build with PyInstaller
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Assemble portable app folder
        run: |
          OUT="PassPoSys-macOS-arm64"
          mkdir -p "$OUT"

          # PyInstaller --onedir output (the .app bundle or plain onedir folder)
          cp -R dist/PassPoSys*.app "$OUT"/ 2>/dev/null || cp -R dist/PassPoSys "$OUT"/

          # Portable MySQL folder, sitting next to the app -- same layout
          # as Windows: mysql/bin/, data/ created on first run by launch.py
          cp -R portable_mysql "$OUT"/mysql

          # Encrypted secrets, reused unchanged from Windows.
          # NOTE: passposys.key is deliberately NOT copied into the
          # artifact -- it's the decryption key for env.enc/token.enc, and
          # Actions artifacts can be broader-visibility than you expect.
          # Copy your own passposys.key next to the app manually after
          # downloading (same step you already do on Windows).
          cp env.enc token.enc "$OUT"/

          # Optional: seed SQL, if present in the repo
          if [ -f passport_db_seed.sql ]; then
            cp passport_db_seed.sql "$OUT"/
          fi

          # start.sh / stop.sh convenience scripts
          cp start.sh stop.sh "$OUT"/
          chmod +x "$OUT"/start.sh "$OUT"/stop.sh

          zip -r "PassPoSys-macOS-arm64.zip" "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassPoSys-macOS-arm64
          path: PassPoSys-macOS-arm64.zip
          retention-days: 30
