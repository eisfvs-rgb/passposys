<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}DB Admin{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f4f5f7; margin:0; color:#1f2430; }
  header { background:#1f2430; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header .db-name { opacity:.7; font-size:13px; }
  main { padding:24px; max-width:1200px; margin:0 auto; }
  table { border-collapse: collapse; width:100%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  th, td { border:1px solid #e3e5ea; padding:8px 10px; font-size:13px; text-align:left; vertical-align:top; }
  th { background:#eef0f3; position:sticky; top:0; }
  tr:hover td { background:#fafbfc; }
  .btn { display:inline-block; padding:6px 12px; border-radius:6px; border:1px solid #d0d3d9; background:#fff; color:#1f2430; text-decoration:none; font-size:13px; cursor:pointer; }
  .btn:hover { background:#f0f1f3; }
  .btn-primary { background:#3b5bdb; border-color:#3b5bdb; color:#fff; }
  .btn-primary:hover { background:#334bc9; }
  .btn-danger { background:#e03131; border-color:#e03131; color:#fff; }
  .btn-danger:hover { background:#c92a2a; }
  input[type=text], textarea { padding:7px 10px; border:1px solid #d0d3d9; border-radius:6px; font-size:13px; width:100%; }
  textarea { font-family: ui-monospace, Menlo, monospace; min-height:140px; }
  .flash { padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:14px; }
  .flash-success { background:#d3f9d8; color:#2b8a3e; }
  .flash-error { background:#ffe3e3; color:#c92a2a; }
  .toolbar { display:flex; gap:10px; margin-bottom:16px; align-items:center; }
  .muted { color:#868e96; font-size:12px; }
  .pk-badge { font-size:10px; background:#e7f5ff; color:#1971c2; padding:1px 5px; border-radius:4px; margin-left:4px; }
  .grid { display:grid; grid-template-columns: 220px 1fr; gap:12px 16px; align-items:center; max-width:700px; }
  .grid label { font-weight:600; font-size:13px; }
  .card { background:#fff; padding:20px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  a.table-link { color:#3b5bdb; text-decoration:none; font-weight:600; }
  a.table-link:hover { text-decoration:underline; }
  .pagination { display:flex; gap:6px; margin-top:16px; }
  code.tag { background:#f1f3f5; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <div><a href="{{ url_for('db_admin.index') }}">&larr; DB Admin</a></div>
  <div class="db-name">{{ database if database is defined else '' }}</div>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash flash-{{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
